[alembic]
# Path to migration scripts
script_location = alembic

# Prepend sys.path so app module is importable
prepend_sys_path = .

# Template used to generate migration file names
file_template = %%(rev)s_%%(slug)s

# sys.path separator for script_location
version_path_separator = os

# version locations (if multiple)
# version_locations = %(here)s/bar:%(here)s/bat:%(here)s/alembic/versions

# The output encoding used when revision files are written from script.py.mako
output_encoding = utf-8

# NOTE: sqlalchemy.url is intentionally left empty here.
# It is set programmatically in alembic/env.py from app.config.Settings.database_url
sqlalchemy.url =


# ── Logging ──────────────────────────────────────────────────────────────────
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
