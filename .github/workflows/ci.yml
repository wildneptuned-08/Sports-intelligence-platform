name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sip
          POSTGRES_PASSWORD: sip_password
          POSTGRES_DB: sip_db
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U sip -d sip_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Install dependencies
        run: uv pip install --system -r requirements.txt

      - name: Lint with ruff
        run: |
          ruff check app tests
          ruff format --check app tests

      - name: Create test database
        env:
          PGPASSWORD: sip_password
        run: |
          psql -h localhost -U sip -d sip_db -c "CREATE DATABASE sip_test;" || true

      - name: Run Alembic migrations
        env:
          DATABASE_URL: postgresql+asyncpg://sip:sip_password@localhost:5432/sip_db
          SECRET_KEY: ci_test_secret_key_not_for_production
        run: alembic upgrade head

      - name: Run tests
        env:
          DATABASE_URL: postgresql+asyncpg://sip:sip_password@localhost:5432/sip_db
          TEST_DATABASE_URL: postgresql+asyncpg://sip:sip_password@localhost:5432/sip_test
          SECRET_KEY: ci_test_secret_key_not_for_production
          ENVIRONMENT: testing
        run: pytest --cov=app --cov-report=xml --cov-report=term-missing -v

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: always()
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  build:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Build production Docker image
        run: docker build --target production -t sip-api:${{ github.sha }} .

      - name: Smoke test built image
        env:
          DATABASE_URL: postgresql+asyncpg://x:x@localhost/x
          SECRET_KEY: smoke_test_only
        run: |
          docker run --rm \
            -e DATABASE_URL \
            -e SECRET_KEY \
            sip-api:${{ github.sha }} \
            python -c "from app.main import app; print('Import OK')"
